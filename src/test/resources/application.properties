spring.application.name=timeflows-tests
spring.datasource.url=jdbc:h2:mem:timeflows-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

timeflows.jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hmac-signing
timeflows.jwt.expiration=PT2H
timeflows.mfa.encryption-key=test-only-mfa-encryption-key-32-bytes
timeflows.mfa.enabled=false
timeflows.mfa.issuer=timeFlows-tests
timeflows.demo-data.enabled=false
timeflows.bootstrap.admin-password=test-only-admin-password
