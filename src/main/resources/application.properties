spring.application.name=timeflows

spring.datasource.url=${DB_URL:jdbc:h2:mem:timeflows;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

timeflows.jwt.secret=${JWT_SECRET:change-this-development-secret-change-this-development-secret}
timeflows.jwt.expiration=${JWT_EXPIRATION:PT8H}
timeflows.mfa.encryption-key=${MFA_ENCRYPTION_KEY:change-this-development-mfa-encryption-key}
timeflows.mfa.issuer=${MFA_ISSUER:timeFlows}
timeflows.demo-data.enabled=${DEMO_DATA_ENABLED:true}
