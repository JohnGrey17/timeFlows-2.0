spring.application.name=timeflows

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

timeflows.jwt.secret=${JWT_SECRET}
timeflows.jwt.expiration=${JWT_EXPIRATION:PT2H}
timeflows.mfa.enabled=${MFA_ENABLED:true}
timeflows.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
timeflows.mfa.issuer=${MFA_ISSUER:timeFlows}
timeflows.demo-data.enabled=${DEMO_DATA_ENABLED:true}
timeflows.bootstrap.admin-password=${INITIAL_ADMIN_PASSWORD:}
