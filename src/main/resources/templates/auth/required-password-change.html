<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timeFlows | Зміна тимчасового пароля</title>
    <link rel="icon" th:href="@{/images/icon_16px_gradient.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-panel">
        <div class="brand">timeFlows</div>
        <h1>Створіть новий пароль</h1>
        <p>Для облікового запису <strong th:text="${email}">user@vyriy.com</strong> адміністратор установив тимчасовий пароль. Щоб продовжити, замініть його на власний.</p>
        <p class="error-message" th:if="${passwordChangeError}" th:text="${passwordChangeError}"></p>
        <form th:action="@{/api/password/required-change}" th:object="${requiredPasswordChangeRequest}" method="post" class="form-stack">
            <label>
                Новий пароль
                <input type="password" th:field="*{newPassword}" minlength="6" autocomplete="new-password" autofocus required>
                <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </label>
            <label>
                Підтвердження нового пароля
                <input type="password" th:field="*{confirmPassword}" minlength="6" autocomplete="new-password" required>
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </label>
            <button type="submit">Зберегти новий пароль</button>
        </form>
    </section>
</main>
</body>
</html>
