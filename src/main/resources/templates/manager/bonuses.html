<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TimeFlows | Бонуси</title><link rel="icon" th:href="@{/images/icon_16px_gradient.png}"><link rel="stylesheet" th:href="@{/css/app.css}"><script defer th:src="@{/js/app-shell.js}"></script><script defer th:src="@{/js/organization-filters.js}"></script></head>
<body class="app-body"><div class="app-layout">
<aside class="sidebar"><button type="button" class="sidebar-toggle" data-sidebar-toggle>☰</button><div class="sidebar-brand">timeFlows</div><nav class="side-nav"><a th:href="@{/api/overtime}"><span class="nav-icon">◷</span><span>Мої перепрацювання</span></a><a th:href="@{/api/overtime/review}"><span class="nav-icon">☑</span><span>Перевірка перепрацювань</span></a><a class="active" th:href="@{/api/bonuses}"><span class="nav-icon">★</span><span>Бонуси</span></a><a th:href="@{/api/users}"><span class="nav-icon">♙</span><span>Користувачі</span></a><a sec:authorize="hasRole('ADMIN')" th:href="@{/api/organization}"><span class="nav-icon">▥</span><span>Керування Відділами</span></a><a sec:authorize="hasRole('ADMIN')" th:href="@{/api/admin/export}"><span class="nav-icon">⇩</span><span>Експорт Excel</span></a><a th:href="@{/api/settings}"><span class="nav-icon">⚙</span><span>Налаштування</span></a></nav><form th:action="@{/api/logout}" method="post" class="logout-form"><button>Вийти</button></form></aside>
<main class="content"><header class="topbar"><div><p class="eyebrow">Bonuses</p><h1>Бонуси</h1></div><div class="user-chip" th:text="${currentUser.firstName+' '+currentUser.lastName}"></div></header><p class="error-message" th:if="${bonusError}" th:text="${bonusError}"></p>

<section class="settings-panel category-management" sec:authorize="hasRole('ADMIN')"><div class="section-title-with-help"><div><p class="eyebrow">Налаштування</p><h2>Категорії бонусів</h2></div><span class="help-tip" tabindex="0" data-tooltip="Тут можна розширювати можливості роботи з бонусами: додавати, перейменовувати й видаляти категорії. Після створення категорія з’явиться у списку вибору бонусу.">?</span></div><form method="post" th:action="@{/api/bonus-categories}" class="category-create-form"><label>Назва нової категорії<input name="name" required maxlength="255" placeholder="Наприклад: Компенсація навчання"></label><button>Додати категорію</button></form><div class="category-admin-list"><div th:each="category:${categories}" class="category-admin-row"><form method="post" th:action="@{/api/bonus-categories/{id}/update(id=${category.id})}" class="inline-form"><input name="name" th:value="${category.name}" required maxlength="255" aria-label="Назва категорії"><button>Зберегти</button></form><form method="post" th:action="@{/api/bonus-categories/{id}/delete(id=${category.id})}"><button class="danger-button">Видалити</button></form></div></div></section>

<section class="bonus-workspace"><div class="section-title-with-help"><div><p class="eyebrow">Операції</p><h2>Робота з бонусами</h2></div><span class="help-tip" tabindex="0" data-tooltip="Тут відображаються бонуси, що відповідають вибраним фільтрам. Їх можна редагувати, видаляти, погоджувати або відхиляти відповідно до ваших прав доступу.">?</span></div>
<form method="get" class="calendar-toolbar"><label sec:authorize="hasRole('ADMIN')">Департамент<select name="departmentId" data-organization-department data-auto-submit><option value="">Всі департаменти</option><option th:each="d:${departments}" th:value="${d.id}" th:selected="${d.id==selectedDepartmentId}" th:text="${d.name}"></option></select></label><label sec:authorize="hasRole('ADMIN')">Підвідділ<select name="divisionId" data-organization-division><option value="">Всі підвідділи</option><option th:each="d:${divisions}" th:value="${d.id}" th:data-department-id="${d.department.id}" th:selected="${d.id==selectedDivisionId}" th:text="${d.name}"></option></select></label><label>Статус<select name="status"><option value="">Всі статуси</option><option th:each="s:${T(example.timeflows.model.BonusStatus).values()}" th:value="${s}" th:selected="${s==selectedStatus}" th:text="${s}"></option></select></label><label>Місяць<select name="month"><option th:each="m:${months}" th:value="${m.value}" th:selected="${m.value==selectedMonth.monthValue}" th:text="${m.label}"></option></select></label><label>Рік<input type="number" name="year" th:value="${selectedMonth.year}"></label><button>Показати</button></form>
<section class="table-panel"><table class="data-table bonus-history-table"><thead><tr><th>Співробітник</th><th>Категорія</th><th>Сума</th><th>Додатковий опис</th><th>Створено</th><th>Статус</th><th>Дії</th></tr></thead><tbody><tr th:each="b:${bonuses}" th:class="${'bonus-status-'+#strings.toLowerCase(b.status.name())}"><td th:text="${b.user.lastName+' '+b.user.firstName+' — '+b.user.email}"></td><td><form class="bonus-cell-form" method="post" th:action="@{/api/bonuses/{id}/category(id=${b.id})}"><select name="categoryId" required><option th:each="category:${categories}" th:value="${category.id}" th:selected="${category.id==b.category.id}" th:text="${category.name}"></option></select><button>Зберегти</button></form></td><td><form class="bonus-cell-form" method="post" th:action="@{/api/bonuses/{id}/amount(id=${b.id})}"><input type="number" name="amount" min="0.01" step="0.01" th:value="${b.amount}" required><button>Зберегти</button></form></td><td><form class="bonus-cell-form" method="post" th:action="@{/api/bonuses/{id}/description(id=${b.id})}"><input name="description" th:value="${b.description}" placeholder="Необов’язково"><button>Зберегти</button></form></td><td th:text="${#temporals.format(b.createdAt,'dd.MM.yyyy HH:mm')}"></td><td th:text="${b.status}"></td><td class="bonus-history-actions"><div class="decision-row" th:if="${b.status.name()=='PENDING'}"><form method="post" th:action="@{/api/bonuses/{id}/approve(id=${b.id})}"><input name="comment" placeholder="Коментар (необов’язково)"><button>Погодити</button></form><form method="post" th:action="@{/api/bonuses/{id}/reject(id=${b.id})}"><input name="comment" required placeholder="Причина відхилення"><button class="danger-button">Відхилити</button></form></div><span th:unless="${b.status.name()=='PENDING'}">Рішення прийнято</span></td></tr></tbody></table></section></section>
</main></div></body></html>
