<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timeFlows | Налаштування</title>
    <link rel="icon" th:href="@{/images/icon_16px_gradient.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app-shell.js}"></script>
</head>
<body class="app-body">
<div class="app-layout">
    <aside class="sidebar">
        <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Згорнути меню">☰</button>
        <div class="sidebar-brand">timeFlows</div>
        <nav class="side-nav" aria-label="Основна навігація">
            <a th:href="@{/api/overtime}"><span class="nav-icon">◷</span><span>Мої перепрацювання</span></a>
            <a sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/api/overtime/review}"><span class="nav-icon">☑</span><span>Перевірка перепрацювань</span></a>
            <a sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/api/bonuses}"><span class="nav-icon">★</span><span>Бонуси</span></a>
            <a sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/api/users}"><span class="nav-icon">♙</span><span>Користувачі</span></a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/organization}"><span class="nav-icon">▥</span><span>Керування Відділами</span></a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/admin/export}"><span class="nav-icon">⇩</span><span>Експорт Excel</span></a>
            <a class="active" th:href="@{/api/settings}"><span class="nav-icon">⚙</span><span>Налаштування</span></a>
        </nav>
        <form th:action="@{/api/logout}" method="post" class="logout-form">
            <button type="submit">Вийти</button>
        </form>
    </aside>

    <main class="content">
        <header class="topbar">
            <div>
                <h1>Налаштування</h1>
            </div>
            <div class="user-chip"
                 th:text="${(currentUser.firstName != null || currentUser.lastName != null) ? ((currentUser.firstName ?: '') + ' ' + (currentUser.lastName ?: '')) : currentUser.email}">
                user@vyriy.com
            </div>
        </header>

        <section class="settings-grid">
            <article class="settings-panel">
                <h2>Профіль</h2>
                <p class="success-message" th:if="${param.profileUpdated}">Профіль оновлено.</p>
                <form th:action="@{/api/settings/profile}" th:object="${profileRequest}" method="post" class="form-stack">
                    <label>
                        Ім'я
                        <input type="text" th:field="*{firstName}">
                        <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </label>
                    <label>
                        Прізвище
                        <input type="text" th:field="*{lastName}">
                        <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </label>
                    <button type="submit">Зберегти</button>
                </form>
            </article>

            <article class="settings-panel">
                <h2>Пароль</h2>
                <p class="success-message" th:if="${param.passwordUpdated}">Пароль оновлено.</p>
                <p class="error-message" th:if="${passwordError}" th:text="${passwordError}"></p>
                <form th:action="@{/api/settings/password}" th:object="${passwordChangeRequest}" method="post" class="form-stack">
                    <label>
                        Поточний пароль
                        <input type="password" th:field="*{currentPassword}" autocomplete="current-password">
                        <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                    </label>
                    <label>
                        Новий пароль
                        <input type="password" th:field="*{newPassword}" autocomplete="new-password">
                        <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                    </label>
                    <label>
                        Підтвердження
                        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
                        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </label>
                    <button type="submit">Оновити пароль</button>
                </form>
            </article>
        </section>
    </main>
</div>
</body>
</html>
