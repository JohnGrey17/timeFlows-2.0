<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timeFlows | Керування відділами</title>
    <link rel="icon" th:href="@{/images/icon_16px_gradient.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app-shell.js}"></script>
</head>
<body class="app-body">
<div class="app-layout">
    <aside class="sidebar">
        <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Згорнути меню">☰</button>
        <div class="sidebar-brand">timeFlows</div>
        <nav class="side-nav">
            <a th:href="@{/api/overtime}"><span class="nav-icon">◷</span><span>Мої перепрацювання</span></a>
            <a th:href="@{/api/overtime/review}"><span class="nav-icon">☑</span><span>Перевірка перепрацювань</span></a>
            <a th:href="@{/api/bonuses}"><span class="nav-icon">★</span><span>Бонуси</span></a>
            <a th:href="@{/api/users}"><span class="nav-icon">♙</span><span>Користувачі</span></a>
            <a class="active" th:href="@{/api/organization}"><span class="nav-icon">▥</span><span>Керування Відділами</span></a>
            <a th:href="@{/api/settings}"><span class="nav-icon">⚙</span><span>Налаштування</span></a>
        </nav>
        <form th:action="@{/api/logout}" method="post" class="logout-form"><button type="submit">Вийти</button></form>
    </aside>
    <main class="content">
        <header class="topbar"><div><p class="eyebrow">ADMIN</p><h1>Керування відділами</h1></div><div class="user-chip" th:text="${currentUser.firstName + ' ' + currentUser.lastName}"></div></header>
        <p class="success-message" th:if="${success}" th:text="${success}"></p>
        <p class="error-message" th:if="${organizationError}" th:text="${organizationError}"></p>
        <div class="organization-grid">
            <section class="settings-panel">
                <div class="section-title-with-help"><h2>Новий департамент</h2><span class="help-tip" tabindex="0" data-tooltip="Створіть великий напрям компанії: вкажіть унікальну назву та, за бажанням, короткий опис. Після створення до нього можна додавати підвідділи.">?</span></div>
                <form th:action="@{/api/organization/departments}" method="post" class="form-stack">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label>Назва<input name="name" required maxlength="150"></label>
                    <label>Опис<textarea name="description" maxlength="500" rows="4"></textarea></label>
                    <button type="submit">Додати департамент</button>
                </form>
            </section>
            <section class="settings-panel">
                <div class="section-title-with-help"><h2>Новий підвідділ</h2><span class="help-tip" tabindex="0" data-tooltip="Оберіть департамент і створіть у ньому підвідділ. Після цього працівників можна буде віднести до цього підвідділу та призначити його керівника.">?</span></div>
                <form th:action="@{/api/organization/divisions}" method="post" class="form-stack">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label>Департамент<select name="departmentId" required><option value="">Оберіть департамент</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}"></option></select></label>
                    <label>Назва підвідділу<input name="name" required maxlength="150"></label>
                    <button type="submit">Додати підвідділ</button>
                </form>
            </section>
        </div>
        <div class="section-title-with-help organization-schema-title"><h2>Схема Компанії</h2><span class="help-tip" tabindex="0" data-tooltip="Тут показана структура компанії: усі департаменти та підвідділи, що входять до них. Ця схема допомагає швидко зрозуміти, як організовані команди, і перевірити щойно створені підрозділи.">?</span></div>
        <section class="organization-list">
            <article th:each="department:${departments}" class="settings-panel">
                <h2 th:text="${department.name}"></h2><p th:text="${department.description}"></p>
                <div class="division-tags"><span th:each="division:${department.divisions}" th:text="${division.name}"></span></div>
            </article>
        </section>
    </main>
</div>
</body></html>
