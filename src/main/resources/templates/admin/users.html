<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timeFlows | Керування користувачами</title>
    <link rel="icon" th:href="@{/images/icon_16px_gradient.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app-shell.js}"></script><script defer th:src="@{/js/organization-filters.js}"></script><script defer th:src="@{/js/user-management.js}"></script>
</head>
<body class="app-body">
<div class="app-layout">
    <aside class="sidebar">
        <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Згорнути меню">☰</button>
        <div class="sidebar-brand">timeFlows</div>
        <nav class="side-nav" aria-label="Основна навігація">
            <a th:href="@{/api/overtime}"><span class="nav-icon">◷</span><span>Мої перепрацювання</span></a>
            <a th:href="@{/api/overtime/review}"><span class="nav-icon">☑</span><span>Перевірка перепрацювань</span></a>
            <a th:if="${currentUser.roles.contains(T(example.timeflows.model.Role).ADMIN)}" th:href="@{/api/bonuses}"><span class="nav-icon">★</span><span>Керування бонусами</span></a>
            <a class="active" th:href="@{/api/users}"><span class="nav-icon">♙</span><span>Керування користувачами</span></a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/organization}"><span class="nav-icon">▥</span><span>Керування Відділами</span></a>
            <a th:href="@{/api/settings}"><span class="nav-icon">⚙</span><span>Налаштування</span></a>
        </nav>
        <form th:action="@{/api/logout}" method="post" class="logout-form">
            <button type="submit">Вийти</button>
        </form>
    </aside>

    <main class="content">
        <header class="topbar">
            <div>
                <p class="eyebrow" th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'Admin' : 'Manager'}">Admin</p>
                <div class="section-title-with-help"><h1>Керування користувачами</h1><span class="help-tip" tabindex="0" data-tooltip="Тут можна переглядати працівників, фільтрувати їх за відділами, змінювати базову ставку, призначати керівника та деактивувати обліковий запис із зазначенням причини.">?</span></div>
            </div>
            <div class="user-chip"
                 th:text="${(currentUser.firstName != null || currentUser.lastName != null) ? ((currentUser.firstName ?: '') + ' ' + (currentUser.lastName ?: '')) : currentUser.email}">
                user@vyriy.com
            </div>
        </header>

        <div class="toolbar-split" sec:authorize="hasRole('ADMIN')">
            <form class="calendar-toolbar" method="get" th:action="@{/api/users}">
                <label sec:authorize="hasRole('ADMIN')">
                    Департамент
                    <select name="departmentId" data-organization-department data-auto-submit>
                        <option value="" sec:authorize="hasRole('ADMIN')">Всі департаменти</option>
                        <option th:each="department:${departments}" th:value="${department.id}" th:selected="${department.id == selectedDepartmentId}" th:text="${department.name}"></option>
                    </select>
                </label>
                <label sec:authorize="hasRole('ADMIN')">
                    Управління
                    <select name="directorateId" data-organization-directorate>
                        <option value="">Всі управління</option>
                        <option th:each="directorate:${directorates}" th:value="${directorate.id}" th:data-department-id="${directorate.department.id}" th:selected="${directorate.id == selectedDirectorateId}" th:text="${directorate.name}"></option>
                    </select>
                </label>
                <label sec:authorize="hasRole('ADMIN')">
                    Відділ
                    <select name="divisionId" data-organization-division>
                        <option value="">Всі відділи</option>
                        <option th:each="division : ${filterDivisions}"
                                th:value="${division.id}"
                                th:data-directorate-id="${division.directorate == null ? '' : division.directorate.id}"
                                th:selected="${division.id == selectedDivisionId}"
                                th:text="${division.name}"></option>
                    </select>
                </label>
                <label sec:authorize="hasRole('ADMIN')">
                    Підвідділ
                    <select name="subdivisionId" data-organization-subdivision>
                        <option value="">Всі підвідділи</option>
                        <option th:each="subdivision:${filterSubdivisions}" th:value="${subdivision.id}" th:data-division-id="${subdivision.division.id}" th:selected="${subdivision.id == selectedSubdivisionId}" th:text="${subdivision.name}"></option>
                    </select>
                </label>
                <label sec:authorize="hasRole('ADMIN')">
                    Групувати
                    <select name="groupBy" data-filter-auto-submit>
                        <option value="department" th:selected="${groupBy == 'department'}">За відділом</option>
                        <option value="role" th:selected="${groupBy == 'role'}">За роллю</option>
                    </select>
                </label>
            </form>
            <a class="link-button" sec:authorize="hasRole('ADMIN')" th:href="@{/api/users/deactivated}">Деактивовані користувачі</a>
        </div>

        <section class="table-panel">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Користувач</th>
                    <th>Відділ</th>
                    <th>Ролі</th>
                    <th>Теги</th>
                    <th>Організація</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <span class="role-badge" th:text="${user.mfaEnabled} ? 'MFA ON' : 'MFA REQUIRED'"></span>
                        <strong th:text="${user.email}">email</strong>
                        <span th:text="${(user.firstName ?: '') + ' ' + (user.lastName ?: '')}">Ім'я Прізвище</span>
                    </td>
                    <td th:text="${user.division.department.name + ' / ' + user.division.name + (user.subdivision == null ? '' : ' / ' + user.subdivision.name)}">Структура</td>
                    <td>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/api/users/{id}/roles(id=${user.id})}" method="post" class="permission-editor" data-user-management-action data-error-title="Не вдалося змінити ролі">
                            <label th:each="role:${T(example.timeflows.model.Role).values()}"><span th:text="${role}"></span><input type="checkbox" name="roles" th:value="${role}" th:checked="${user.roles.contains(role)}"></label>
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}"><input type="hidden" name="directorateId" th:value="${selectedDirectorateId}"><input type="hidden" name="divisionId" th:value="${selectedDivisionId}"><input type="hidden" name="subdivisionId" th:value="${selectedSubdivisionId}"><input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit">Зберегти ролі</button>
                        </form>
                    </td>
                    <td>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/api/users/{id}/tags(id=${user.id})}" method="post" class="permission-editor" data-user-management-action data-error-title="Не вдалося змінити теги">
                            <label><span>PM</span><input type="checkbox" name="tags" value="PROJECT_MANAGER" th:checked="${user.tags.contains(T(example.timeflows.model.BusinessTag).PROJECT_MANAGER)}"></label>
                            <label><span>PM LEAD</span><input type="checkbox" name="tags" value="PROJECT_MANAGER_LEAD" th:checked="${user.tags.contains(T(example.timeflows.model.BusinessTag).PROJECT_MANAGER_LEAD)}"></label>
                            <label><span>ALLOW_OVER</span><input type="checkbox" name="tags" value="ALLOW_OVER" th:checked="${user.tags.contains(T(example.timeflows.model.BusinessTag).ALLOW_OVER)}"></label>
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}"><input type="hidden" name="directorateId" th:value="${selectedDirectorateId}"><input type="hidden" name="divisionId" th:value="${selectedDivisionId}"><input type="hidden" name="subdivisionId" th:value="${selectedSubdivisionId}"><input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit">Зберегти теги</button>
                        </form>
                    </td>
                    <td>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/api/users/{id}/organization(id=${user.id})}"
                              method="post"
                              class="inline-form organization-assignment"
                              data-user-management-action
                              data-error-title="Не вдалося перенести користувача">
                            <select name="targetDivisionId" required data-assignment-division>
                                <option th:each="division:${allDivisions}"
                                        th:value="${division.id}"
                                        th:selected="${division.id == user.division.id}"
                                        th:text="${division.department.name + ' / ' + division.name}"></option>
                            </select>
                            <select name="subdivisionId" data-assignment-subdivision>
                                <option value="">Без підвідділу</option>
                                <option th:each="subdivision:${allSubdivisions}"
                                        th:value="${subdivision.id}"
                                        th:data-division-id="${subdivision.division.id}"
                                        th:selected="${user.subdivision != null and subdivision.id == user.subdivision.id}"
                                        th:text="${subdivision.name}"></option>
                            </select>
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}">
                            <input type="hidden" name="divisionId" th:value="${selectedDivisionId}">
                            <input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit">Перевести</button>
                        </form>
                    </td>
                    <td>
                        <form sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                              th:if="${user.id != currentUser.id}"
                              th:action="@{/api/users/{id}/deactivate(id=${user.id})}"
                              method="post"
                              class="inline-form">
                            <input type="text" name="reason" placeholder="Причина" required>
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}"><input type="hidden" name="divisionId" th:value="${selectedDivisionId}"><input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit" class="danger-button">Деактивувати</button>
                        </form>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:if="${user.mfaEnabled && user.id != currentUser.id}"
                              th:action="@{/api/users/{id}/mfa/reset(id=${user.id})}"
                              method="post"
                              class="inline-form">
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}">
                            <input type="hidden" name="divisionId" th:value="${selectedDivisionId}">
                            <input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit" class="danger-button" onclick="return confirm('Скинути MFA користувача? Наступний вхід вимагатиме нового QR-коду.')">Скинути MFA</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
