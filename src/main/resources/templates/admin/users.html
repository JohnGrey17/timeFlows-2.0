<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timeFlows | Користувачі</title>
    <link rel="icon" th:href="@{/images/icon_16px_gradient.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app-shell.js}"></script><script defer th:src="@{/js/organization-filters.js}"></script>
</head>
<body class="app-body">
<div class="app-layout">
    <aside class="sidebar">
        <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Згорнути меню">☰</button>
        <div class="sidebar-brand">timeFlows</div>
        <nav class="side-nav" aria-label="Основна навігація">
            <a th:href="@{/api/overtime}"><span class="nav-icon">◷</span><span>Мої перепрацювання</span></a>
            <a th:href="@{/api/overtime/review}"><span class="nav-icon">☑</span><span>Перевірка перепрацювань</span></a>
            <a th:href="@{/api/bonuses}"><span class="nav-icon">★</span><span>Бонуси</span></a>
            <a class="active" th:href="@{/api/users}"><span class="nav-icon">♙</span><span>Користувачі</span></a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/organization}"><span class="nav-icon">▥</span><span>Керування Відділами</span></a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/api/admin/export}"><span class="nav-icon">⇩</span><span>Експорт Excel</span></a>
            <a th:href="@{/api/settings}"><span class="nav-icon">⚙</span><span>Налаштування</span></a>
        </nav>
        <form th:action="@{/api/logout}" method="post" class="logout-form">
            <button type="submit">Вийти</button>
        </form>
    </aside>

    <main class="content">
        <header class="topbar">
            <div>
                <p class="eyebrow" th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'Admin' : 'Manager'}">Admin</p>
                <div class="section-title-with-help"><h1>Користувачі</h1><span class="help-tip" tabindex="0" data-tooltip="Тут можна переглядати працівників, фільтрувати їх за відділами, змінювати базову ставку, призначати керівника та деактивувати обліковий запис із зазначенням причини.">?</span></div>
            </div>
            <div class="user-chip"
                 th:text="${(currentUser.firstName != null || currentUser.lastName != null) ? ((currentUser.firstName ?: '') + ' ' + (currentUser.lastName ?: '')) : currentUser.email}">
                user@vyriy.com
            </div>
        </header>

        <div class="toolbar-split">
            <form class="calendar-toolbar" method="get" th:action="@{/api/users}">
                <label>
                    Департамент
                    <select name="departmentId" data-organization-department data-auto-submit>
                        <option value="" sec:authorize="hasRole('ADMIN')">Всі департаменти</option>
                        <option th:each="department:${departments}" th:value="${department.id}" th:selected="${department.id == selectedDepartmentId}" th:text="${department.name}"></option>
                    </select>
                </label>
                <label>
                    Підвідділ
                    <select name="divisionId" data-organization-division>
                        <option value="">Всі підвідділи</option>
                        <option th:each="division : ${divisions}"
                                th:value="${division.id}"
                                th:data-department-id="${division.department.id}"
                                th:selected="${division.id == selectedDivisionId}"
                                th:text="${division.department.name + ' / ' + division.name}"></option>
                    </select>
                </label>
                <label>
                    Групувати
                    <select name="groupBy">
                        <option value="department" th:selected="${groupBy == 'department'}">За відділом</option>
                        <option value="role" th:selected="${groupBy == 'role'}">За роллю</option>
                    </select>
                </label>
                <button type="submit">Показати</button>
            </form>
            <a class="link-button" sec:authorize="hasRole('ADMIN')" th:href="@{/api/users/deactivated}">Деактивовані користувачі</a>
        </div>

        <section class="table-panel">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Користувач</th>
                    <th>Відділ</th>
                    <th>Ролі</th>
                    <th>ЗП</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <span class="role-badge" th:text="${user.mfaEnabled} ? 'MFA ON' : 'MFA REQUIRED'"></span>
                        <strong th:text="${user.email}">email</strong>
                        <span th:text="${(user.firstName ?: '') + ' ' + (user.lastName ?: '')}">Ім'я Прізвище</span>
                    </td>
                    <td th:text="${user.division.department.name + ' / ' + user.division.name}">Department / Division</td>
                    <td>
                        <span th:each="role : ${user.roles}" class="role-badge" th:classappend="${' role-'+#strings.toLowerCase(role.name())}" th:text="${role}">ROLE</span>
                    </td>
                    <td>
                        <form th:action="@{/api/users/{id}/salary(id=${user.id})}" method="post" class="inline-form">
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}"><input type="hidden" name="divisionId" th:value="${selectedDivisionId}"><input type="hidden" name="groupBy" th:value="${groupBy}">
                            <input type="number" name="salary" min="0" step="0.01" th:value="${user.salary}">
                            <button type="submit">OK</button>
                        </form>
                    </td>
                    <td>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/api/divisions/{divisionId}/manager(divisionId=${user.division.id})}"
                              method="post"
                              class="inline-form">
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}">
                            <input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit" class="manager-button" th:classappend="${user.division.manager != null && user.division.manager.id == user.id ? ' current-manager' : ''}">Зробити керівником <span class="help-tip" title="Призначає співробітника керівником його підвідділу. Керівник може погоджувати або відхиляти перепрацювання, керувати зарплатами співробітників свого підвідділу та деактивувати звільнених користувачів. Функціонал відпусток буде додано окремо.">?</span></button>
                        </form>
                        <form sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                              th:action="@{/api/users/{id}/deactivate(id=${user.id})}"
                              method="post"
                              class="inline-form">
                            <input type="text" name="reason" placeholder="Причина" required>
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}"><input type="hidden" name="divisionId" th:value="${selectedDivisionId}"><input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit" class="danger-button">Деактивувати</button>
                        </form>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:if="${user.mfaEnabled && user.id != currentUser.id}"
                              th:action="@{/api/users/{id}/mfa/reset(id=${user.id})}"
                              method="post"
                              class="inline-form">
                            <input type="hidden" name="departmentId" th:value="${selectedDepartmentId}">
                            <input type="hidden" name="divisionId" th:value="${selectedDivisionId}">
                            <input type="hidden" name="groupBy" th:value="${groupBy}">
                            <button type="submit" class="danger-button" onclick="return confirm('Скинути MFA користувача? Наступний вхід вимагатиме нового QR-коду.')">Скинути MFA</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
