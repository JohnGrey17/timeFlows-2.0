databaseChangeLog:
  - changeSet:
      id: 002-create-divisions-table
      author: codex
      changes:
        - createTable:
            tableName: divisions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: divisions
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_divisions_departments
        - addUniqueConstraint:
            tableName: divisions
            columnNames: department_id, name
            constraintName: uk_division_department_name
